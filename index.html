<!DOCTYPE html>
<html>
<head>
    <title>Mentoring Project</title>
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; }
        .form-box { border: 1px solid #ccc; padding: 20px; display: inline-block; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="form-box">
        <h1>Idea Mentoring Submission</h1>
        <input type="text" id="name" placeholder="Name"><br><br>
        <input type="email" id="email" placeholder="Email"><br><br>
        <textarea id="idea" placeholder="Your Idea"></textarea><br><br>
        <button onclick="submitData()">Submit & Send Email</button>
    </div>

   <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script> 
   <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
 <script>
    // 1. Initialize Supabase (SQL Database)
// Replace the keys below with your actual ones if they are different
const supabaseUrl = "https://tvloopiijbwwxwrmrxkm.supabase.co";
const supabaseKey = "sb_publishable_K8DmkgBvOXvwQS0s1csZQ_l13y_..."; // Use your full key here
const supabase = supabase.createClient(supabaseUrl, supabaseKey);

// 2. Initialize EmailJS
emailjs.init("grJmOhwQTxCN5Q0zB");

async function submitData() {
    // Get values from the form input fields
    const userEmail = document.getElementById("email").value;
    const userName = document.getElementById("name").value;
    const userIdea = document.getElementById("idea").value;

    if (!userEmail || !userName || !userIdea) {
        alert("Please fill in all fields!");
        return;
    }

    try {
        // A. Send the Email via EmailJS
        await emailjs.send("service_xjyx8mq", "template_8euda9k", {
            to_name: userName,
            to_email: userEmail,
            message: userIdea,
        });

        // B. Save to your Supabase SQL Table
        const { error } = await supabase
            .from('submissions')
            .insert([
                { 
                    name: userName, 
                    email: userEmail, 
                    idea: userIdea 
                }
            ]);

        if (error) throw error;

        alert("Success! Your idea was saved and email sent.");
        
        // Clear the form
        document.getElementById("email").value = "";
        document.getElementById("name").value = "";
        document.getElementById("idea").value = "";

    } catch (err) {
        console.error("Error:", err);
        alert("Email sent, but there was an error saving to the database.");
    }
}
</script>
</body>
</html>
