<!DOCTYPE html>
<html>
<head>
    <title>Mentoring Project</title>
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; }
        .form-box { border: 1px solid #ccc; padding: 20px; display: inline-block; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="form-box">
        <h1>Idea Mentoring Submission</h1>
        <input type="text" id="name" placeholder="Name"><br><br>
        <input type="email" id="email" placeholder="Email"><br><br>
        <textarea id="idea" placeholder="Your Idea"></textarea><br><br>
        <button onclick="submitData()">Submit & Send Email</button>
    </div>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script>
        (function(){
            emailjs.init("YOUR_PUBLIC_KEY"); // Replace with your real Key from EmailJS
        })();
emailjs.init("grJmOhwQTxCN5Q0zB");
        function submitData() {
            const userEmail = document.getElementById("email").value;
            const userName = document.getElementById("name").value;

            emailjs.send("service_xjyx8mq", "template_8euda9k", {
                to_name: userName,
                to_email: userEmail,
                message: "Success! Your idea has been mentored. Thanks for providing your data!"
            }).then(() => {
                alert("Data processed and Thank You email sent!");
            });
        }

</script>
</body>
</html>
